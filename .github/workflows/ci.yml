name: CI — Build & Verification Gate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend-check:
    name: Backend Syntax & Startup Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify ESM syntax across backend
        run: |
          node --check src/index.js
          node --check src/app.js
          node --check src/config.js
          node --check src/middlewares/rateLimit.middleware.js
      - name: Run Critical Backend Tests (Vitest)
        run: npm test

  frontend-build:
    name: Frontend Production Build (Linux Case-Sensitive)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Production Vite + PWA Build
        env:
          VITE_BACKEND_URL: https://api.example.com/api
        run: npm run build
